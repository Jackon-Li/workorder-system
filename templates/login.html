{% extends 'base.html' %}
{% block title %}登录 - 售后工单管理系统{% endblock %}
{% block standalone %}
<div class="container">
    <div class="row justify-content-center" style="margin-top:120px">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4"><i class="fas fa-ticket-alt"></i> 售后工单管理系统</h4>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show">
                        {{ message }}<button type="button" class="close" data-dismiss="alert">&times;</button>
                    </div>
                    {% endfor %}
                    {% endif %}
                    {% endwith %}
                    <form method="post">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-sign-in-alt"></i> 登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
